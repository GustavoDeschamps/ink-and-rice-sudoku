<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数独 Sudoku — A mindful puzzle</title>
    <meta name="description" content="A minimal Japanese-inspired Sudoku with ranks, friends and leaderboards." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Shippori+Mincho:wght@500;700&display=swap"
    />
    <!-- SPA routing: restore path redirected via 404.html -->
    <script>
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("p");
        if (redirect) {
          var base = "/ink-and-rice-sudoku";
          window.history.replaceState(null, "", base + redirect + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
